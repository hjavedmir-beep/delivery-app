<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver App - Rider Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl border-4 border-gray-800 overflow-hidden flex flex-col h-[700px]">
        
        <!-- Header -->
        <div class="bg-green-600 text-white p-4 flex justify-between items-center">
            <div>
                <h1 class="font-bold text-lg">Rider App</h1>
                <p class="text-xs opacity-90" id="driverInfo">Driver: Not Logged In</p>
            </div>
            <button onclick="logoutDriver()" class="bg-red-500 text-xs px-2 py-1 rounded text-white font-semibold">Logout</button>
        </div>

        <!-- Login Screen Section -->
        <div id="loginSection" class="p-6 flex-1 flex flex-col justify-center bg-gray-50">
            <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">Driver Login</h2>
            <select id="driverSelect" class="w-full p-3 border rounded-xl mb-4 text-sm bg-white">
                <option value="1">Ali Khan (ID: 1)</option>
                <option value="2">Ahmed Raza (ID: 2)</option>
                <option value="3">Usman Ali (ID: 3)</option>
            </select>
            <button onclick="loginDriver()" class="w-full bg-green-600 text-white py-3 rounded-xl font-semibold shadow hover:bg-green-700">Start Shift</button>
        </div>

        <!-- Main Dashboard Section -->
        <div id="dashboardSection" class="hidden flex-1 flex flex-col overflow-hidden">
            <div class="p-4 flex-1 overflow-y-auto bg-gray-50" id="tabContent">
                <!-- Dynamic Content -->
            </div>

            <div class="bg-white border-t p-3 flex justify-around text-xs font-semibold text-gray-500">
                <button onclick="switchTab('jobs')" id="btnJobs" class="text-green-600">Jobs</button>
                <button onclick="switchTab('earnings')" id="btnEarnings">Earnings</button>
            </div>
        </div>

    </div>

    <script>
        const API_URL = 'https://alumni-skinny-morbidly.ngrok-free.dev/api';
        let currentDriverId = localStorage.getItem('driverId') || null;
        let currentDriverName = localStorage.getItem('driverName') || '';
        let activeTab = 'jobs';
        let lastOrderCount = 0;

        // نوٹیفیکیشن ساؤنڈ کے لیے بیپ آڈیو
        const alertSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

        function checkLoginState() {
            if (currentDriverId) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('driverInfo').innerText = `Driver: ${currentDriverName}`;
                loadTabData();
                startLocationTracking(); // جی پی ایس ٹریکنگ شروع کریں
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
            }
        }

        function loginDriver() {
            const select = document.getElementById('driverSelect');
            currentDriverId = select.value;
            currentDriverName = select.options[select.selectedIndex].text;
            localStorage.setItem('driverId', currentDriverId);
            localStorage.setItem('driverName', currentDriverName);
            checkLoginState();
        }

        function logoutDriver() {
            localStorage.clear();
            currentDriverId = null;
            checkLoginState();
        }

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('btnJobs').className = tab === 'jobs' ? 'text-green-600 font-bold' : 'text-gray-500';
            document.getElementById('btnEarnings').className = tab === 'earnings' ? 'text-green-600 font-bold' : 'text-gray-500';
            loadTabData();
        }

        async function loadTabData() {
            try {
                const res = await fetch(`${API_URL}/orders`);
                const orders = await res.json();
                const myOrders = orders.filter(o => String(o.assignedDriverId) === String(currentDriverId));

                // نیا آرڈر آنے پر ساؤنڈ الرट بجانا
                if (activeTab === 'jobs' && myOrders.length > lastOrderCount && lastOrderCount !== 0) {
                    alertSound.play().catch(e => console.log("Audio play blocked"));
                }
                lastOrderCount = myOrders.length;

                if (activeTab === 'jobs') {
                    renderJobs(myOrders);
                } else if (activeTab === 'earnings') {
                    renderEarnings(myOrders);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderJobs(orders) {
            const container = document.getElementById('tabContent');
            if (orders.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-gray-400 text-sm">No active orders assigned.</div>`;
                return;
            }
            container.innerHTML = '';
            orders.forEach(o => {
                container.innerHTML += `
                    <div class="bg-white p-3 rounded-xl shadow border mb-3 text-xs">
                        <div class="flex justify-between font-bold mb-1">
                            <span>Order #${o.id}</span>
                            <span class="text-amber-600">${o.status}</span>
                        </div>
                        <p><strong>Customer:</strong> ${o.customerName}</p>
                        <p><strong>Dropoff:</strong> ${o.dropoffAddress}</p>
                        <div class="mt-2 pt-2 border-t flex gap-1">
                            <button onclick="updateStatus('${o.id}', 'Accepted')" class="bg-blue-500 text-white px-2 py-1 rounded">Accept</button>
                            <button onclick="updateStatus('${o.id}', 'Out for Delivery')" class="bg-yellow-500 text-white px-2 py-1 rounded">Dispatched</button>
                            <button onclick="updateStatus('${o.id}', 'Delivered')" class="bg-green-500 text-white px-2 py-1 rounded">Delivered</button>
                        </div>
                    </div>`;
            });
        }

        function renderEarnings(orders) {
            const container = document.getElementById('tabContent');
            const completed = orders.filter(o => o.status === 'Delivered');
            const totalEarned = completed.length * 5.00;

            container.innerHTML = `
                <div class="bg-white p-5 rounded-xl shadow border text-center">
                    <h3 class="text-gray-500 text-sm mb-1">Total Earnings</h3>
                    <p class="text-3xl font-bold text-green-600 mb-4">£${totalEarned.toFixed(2)}</p>
                    <div class="bg-gray-50 p-3 rounded text-left text-xs">
                        <p class="font-bold mb-2">Completed Deliveries: ${completed.length}</p>
                        ${completed.map(o => `<div class="flex justify-between py-1 border-b"><span>Order #${o.id}</span><span>£5.00</span></div>`).join('')}
                    </div>
                </div>`;
        }

        async function updateStatus(orderId, status) {
            await fetch(`${API_URL}/orders/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId, status })
            });
            loadTabData();
        }

        // لائیو جی پی ایس لوکیشن سرور پر بھیجنے کا فنکشن
        function startLocationTracking() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    try {
                        await fetch(`${API_URL}/driver/location`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ driverId: currentDriverId, lat, lng })
                        });
                    } catch (e) {
                        console.log("Location sync error");
                    }
                }, (error) => {
                    console.log("GPS Error: ", error);
                }, { enableHighAccuracy: true });
            }
        }

        checkLoginState();
        setInterval(loadTabData, 3000);
    </script>
</body>
</html>
