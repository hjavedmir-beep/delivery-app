<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver App - Home & Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-200 min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-50 w-full max-w-sm rounded-3xl shadow-2xl border-4 border-gray-800 overflow-hidden flex flex-col h-[750px] relative">
        
        <!-- Login Screen Section -->
        <div id="loginSection" class="p-6 flex-1 flex flex-col justify-center bg-white absolute inset-0 z-50">
            <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">Driver Login</h2>
            <select id="driverSelect" class="w-full p-3 border rounded-xl mb-4 text-sm bg-white">
                <option value="1">Ali Khan (ID: 1)</option>
                <option value="2">Ahmed Raza (ID: 2)</option>
                <option value="3">Usman Ali (ID: 3)</option>
            </select>
            <button onclick="loginDriver()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-semibold shadow hover:bg-emerald-700">Start Shift</button>
        </div>

        <!-- Main Content Area -->
        <div id="dashboardSection" class="flex-1 flex flex-col overflow-hidden hidden">
            
            <div class="flex-1 overflow-y-auto pb-20 relative flex flex-col" id="mainTabContainer">
                <!-- Content will dynamically switch here -->
            </div>

            <!-- Bottom Navigation Bar -->
            <div class="absolute bottom-0 left-0 right-0 bg-white border-t py-2 px-6 flex justify-around items-center shadow-lg z-40">
                <button onclick="switchNav('home')" id="navHome" class="flex flex-col items-center text-emerald-700 font-bold text-xs bg-emerald-100 px-4 py-1 rounded-full">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Home
                </button>
                <button onclick="switchNav('wallet')" id="navWallet" class="flex flex-col items-center text-gray-400 text-xs">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
                    Wallet
                </button>
                <button onclick="switchNav('profile')" id="navProfile" class="flex flex-col items-center text-gray-400 text-xs">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    Profile
                </button>
            </div>

        </div>

    </div>

    <script>
        const API_URL = 'https://delivery-app-vzp3.onrender.com/api';
        let currentDriverId = localStorage.getItem('driverId') || null;
        let currentDriverName = localStorage.getItem('driverName') || '';
        let currentNav = 'home';
        let walletFilter = 'Daily';
        let globalOrders = [];
        let isOnline = false;
        let map = null;
        let marker = null;

        let selectedDate = new Date().toISOString().split('T')[0];
        const alertSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        let lastOrderCount = 0;

        function checkLoginState() {
            if (currentDriverId) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                fetchOrders();
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
            }
        }

        function loginDriver() {
            const select = document.getElementById('driverSelect');
            currentDriverId = select.value;
            currentDriverName = select.options[select.selectedIndex].text;
            localStorage.setItem('driverId', currentDriverId);
            localStorage.setItem('driverName', currentDriverName);
            checkLoginState();
        }

        function logoutDriver() {
            localStorage.clear();
            currentDriverId = null;
            checkLoginState();
        }

        function switchNav(nav) {
            currentNav = nav;
            document.getElementById('navHome').className = nav === 'home' ? 'flex flex-col items-center text-emerald-700 font-bold text-xs bg-emerald-100 px-4 py-1 rounded-full' : 'flex flex-col items-center text-gray-400 text-xs';
            document.getElementById('navWallet').className = nav === 'wallet' ? 'flex flex-col items-center text-emerald-700 font-bold text-xs bg-emerald-100 px-4 py-1 rounded-full' : 'flex flex-col items-center text-gray-400 text-xs';
            document.getElementById('navProfile').className = nav === 'profile' ? 'flex flex-col items-center text-emerald-700 font-bold text-xs bg-emerald-100 px-4 py-1 rounded-full' : 'flex flex-col items-center text-gray-400 text-xs';
            renderScreen();
        }

        async function fetchOrders() {
            try {
                const res = await fetch(`${API_URL}/orders`);
                const orders = await res.json();
                globalOrders = orders.filter(o => String(o.assignedDriverId) === String(currentDriverId));

                if (globalOrders.length > lastOrderCount && lastOrderCount !== 0) {
                    alertSound.play().catch(e => console.log("Audio play blocked"));
                }
                lastOrderCount = globalOrders.length;
                renderScreen();
            } catch (err) {
                console.error(err);
            }
        }

        function toggleGoOnline() {
            isOnline = !isOnline;
            renderScreen();
            if (isOnline) {
                startLocationTracking();
            }
        }

        function renderScreen() {
            const container = document.getElementById('mainTabContainer');

            if (currentNav === 'home') {
                const activeOrders = globalOrders.filter(o => o.status !== 'Delivered');
                
                if (activeOrders.length > 0) {
                    // Show Active Jobs
                    container.innerHTML = `
                        <div class="bg-emerald-600 text-white p-4 font-bold text-lg">Active Jobs</div>
                        <div class="p-4">
                            ${activeOrders.map(o => `
                                <div class="bg-white p-4 rounded-xl shadow border mb-3 text-xs">
                                    <div class="flex justify-between font-bold mb-2">
                                        <span>Order #${o.id}</span>
                                        <span class="text-amber-600">${o.status}</span>
                                    </div>
                                    <p class="mb-1"><strong>Customer:</strong> ${o.customerName}</p>
                                    <p class="mb-3"><strong>Dropoff:</strong> ${o.dropoffAddress}</p>
                                    <div class="flex gap-1">
                                        <button onclick="updateStatus('${o.id}', 'Accepted')" class="bg-blue-500 text-white px-2 py-1.5 rounded flex-1">Accept</button>
                                        <button onclick="updateStatus('${o.id}', 'Out for Delivery')" class="bg-yellow-500 text-white px-2 py-1.5 rounded flex-1">Dispatched</button>
                                        <button onclick="updateStatus('${o.id}', 'Delivered')" class="bg-emerald-600 text-white px-2 py-1.5 rounded flex-1">Delivered</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>`;
                } else {
                    // Show Map & Go Online Button when no jobs
                    container.innerHTML = `
                        <div class="bg-emerald-600 text-white p-4 flex justify-between items-center shadow-md">
                            <span class="font-bold text-lg">Live Radar</span>
                            <span class="text-xs bg-emerald-700 px-2 py-1 rounded-full">${isOnline ? '🟢 Online' : '🔴 Offline'}</span>
                        </div>
                        <div class="flex-1 relative flex flex-col h-full">
                            <div id="driverMap" class="w-full flex-1" style="min-height: 400px;"></div>
                            
                            <!-- Go Online Floating Panel -->
                            <div class="absolute bottom-4 left-4 right-4 bg-white p-4 rounded-2xl shadow-lg border text-center z-[999]">
                                <p class="text-xs text-gray-500 mb-2">${isOnline ? 'You are online, waiting for new orders...' : 'Tap below to turn on your location and start receiving jobs.'}</p>
                                <button onclick="toggleGoOnline()" class="w-full py-3 rounded-xl font-bold text-sm text-white shadow ${isOnline ? 'bg-red-500 hover:bg-red-600' : 'bg-emerald-600 hover:bg-emerald-700'}">
                                    ${isOnline ? 'Go Offline' : 'Go Online'}
                                </button>
                            </div>
                        </div>`;
                    
                    // Initialize Map after DOM render
                    setTimeout(initMap, 200);
                }
            } else if (currentNav === 'wallet') {
                const dateFilteredOrders = globalOrders.filter(o => {
                    const orderDate = o.date ? o.date.split('T')[0] : new Date().toISOString().split('T')[0];
                    return orderDate === selectedDate && o.status === 'Delivered';
                });
                const totalEarned = dateFilteredOrders.length * 5.00;

                container.innerHTML = `
                    <div class="bg-emerald-600 text-white pt-6 pb-8 px-4 rounded-b-[30px] shadow-md text-center">
                        <h1 class="text-lg font-bold mb-4">Wallet</h1>
                        <p class="text-3xl font-extrabold tracking-tight mb-1">£${totalEarned.toFixed(2)}</p>
                        <p class="text-xs text-emerald-100">Today's earnings</p>
                    </div>
                    <div class="p-4">
                        <h3 class="text-gray-800 font-bold text-sm mb-3">Select Date Record</h3>
                        <div class="bg-white rounded-2xl shadow-sm border p-4 mb-4">
                            <input type="date" value="${selectedDate}" onchange="selectedDate=this.value; renderScreen();" class="w-full text-xs border rounded-lg p-2 bg-gray-50 font-semibold text-emerald-700">
                        </div>
                        <h3 class="text-gray-800 font-bold text-sm mb-3">Completed Trips (${dateFilteredOrders.length})</h3>
                        <div class="bg-white rounded-2xl shadow-sm border p-3 text-xs">
                            ${dateFilteredOrders.length === 0 ? '<p class="text-gray-400 text-center py-3">No trips found for this date.</p>' : dateFilteredOrders.map(o => `
                                <div class="flex justify-between py-2 border-b last:border-none">
                                    <span>Order #${o.id} (${o.customerName})</span>
                                    <span class="text-emerald-600 font-semibold">£5.00</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
            } else if (currentNav === 'profile') {
                container.innerHTML = `
                    <div class="bg-emerald-600 text-white p-4 font-bold text-lg">Profile</div>
                    <div class="p-4 text-center">
                        <div class="bg-white p-6 rounded-2xl shadow border mb-4">
                            <div class="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center text-xl font-bold mx-auto mb-3">${currentDriverName.charAt(0)}</div>
                            <h3 class="font-bold text-gray-800 text-base">${currentDriverName}</h3>
                            <p class="text-xs text-gray-500 mb-4">Rider ID: #${currentDriverId}</p>
                            <button onclick="logoutDriver()" class="w-full bg-red-500 text-white py-2.5 rounded-xl font-semibold text-xs">Logout</button>
                        </div>
                    </div>`;
            }
        }

        function initMap() {
            if (map) {
                map.remove();
                map = null;
            }
            map = L.map('driverMap').setView([53.0027, -2.1794], 13); // Default Stoke-on-Trent coordinates
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
            }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.setView([lat, lng], 15);
                    marker = L.marker([lat, lng]).addTo(map).bindPopup("You are here").openPopup();
                });
            }
        }

        function startLocationTracking() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    if (map && marker) {
                        marker.setLatLng([lat, lng]);
                        map.panTo([lat, lng]);
                    }

                    try {
                        await fetch(`${API_URL}/driver/location`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ driverId: currentDriverId, lat, lng })
                        });
                    } catch (e) {}
                }, () => {}, { enableHighAccuracy: true });
            }
        }

        async function updateStatus(orderId, status) {
            await fetch(`${API_URL}/orders/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId, status })
            });
            fetchOrders();
        }

        checkLoginState();
        setInterval(fetchOrders, 3000);
    </script>
</body>
</html>
