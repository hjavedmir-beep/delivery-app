<script>
        const API_URL = 'https://delivery-app-vzp3.onrender.com/api';
        let adminMap = null;
        let dedicatedMap = null;
        let markersLayer = null;
        let dedicatedMarkersLayer = null;
        let onlineDriversCache = {};
        let allOrdersCache = [];
        let dropoffCoords = { lat: null, lng: null };

        // Custom Leaflet Icons
        const carIcon = L.divIcon({
            className: 'custom-car-marker',
            html: '<div style="background-color: #2563eb; color: white; padding: 6px 10px; border-radius: 9999px; font-weight: bold; font-size: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 4px; border: 2px solid white;">🚗 Car</div>',
            iconSize: [60, 30],
            iconAnchor: [30, 15]
        });

        const businessIcon = L.divIcon({
            className: 'custom-business-marker',
            html: '<div style="background-color: #059669; color: white; padding: 6px 10px; border-radius: 9999px; font-weight: bold; font-size: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 4px; border: 2px solid white;">🏢 Business</div>',
            iconSize: [80, 30],
            iconAnchor: [40, 15]
        });

        function switchTab(tab) {
            document.getElementById('tabContentActive').classList.add('hidden');
            document.getElementById('tabContentMap').classList.add('hidden');
            document.getElementById('tabContentDrivers').classList.add('hidden');
            document.getElementById('tabContentBusinesses').classList.add('hidden');

            document.getElementById('navTabActive').className = 'bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-lg font-bold text-sm transition';
            document.getElementById('navTabMap').className = 'bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-lg font-bold text-sm transition';
            document.getElementById('navTabDrivers').className = 'bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-lg font-bold text-sm transition';
            document.getElementById('navTabBusinesses').className = 'bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-lg font-bold text-sm transition';

            if (tab === 'active') {
                document.getElementById('tabContentActive').classList.remove('hidden');
                document.getElementById('navTabActive').className = 'bg-blue-700 px-4 py-2 rounded-lg font-bold text-sm transition';
                fetchOrders();
                refreshMapPins();
                setTimeout(() => { if (adminMap) adminMap.invalidateSize(); }, 200);
            } else if (tab === 'map') {
                document.getElementById('tabContentMap').classList.remove('hidden');
                document.getElementById('navTabMap').className = 'bg-blue-700 px-4 py-2 rounded-lg font-bold text-sm transition';
                refreshMapPins();
                setTimeout(() => { if (dedicatedMap) dedicatedMap.invalidateSize(); }, 200);
            } else if (tab === 'drivers') {
                document.getElementById('tabContentDrivers').classList.remove('hidden');
                document.getElementById('navTabDrivers').className = 'bg-blue-700 px-4 py-2 rounded-lg font-bold text-sm transition';
                loadDriversManagement();
            } else if (tab === 'businesses') {
                document.getElementById('tabContentBusinesses').classList.remove('hidden');
                document.getElementById('navTabBusinesses').className = 'bg-blue-700 px-4 py-2 rounded-lg font-bold text-sm transition';
                loadBusinessesManagement();
            }
        }

        function initAdminMap() {
            if (!adminMap) {
                adminMap = L.map('adminMap').setView([53.0027, -2.1794], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(adminMap);
                markersLayer = L.layerGroup().addTo(adminMap);
            }

            if (!dedicatedMap) {
                dedicatedMap = L.map('dedicatedAdminMap').setView([53.0027, -2.1794], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(dedicatedMap);
                dedicatedMarkersLayer = L.layerGroup().addTo(dedicatedMap);
            }
        }

        async function lookupPostcode(postcode) {
            const areaInput = document.getElementById('busArea');
            const cleanPostcode = postcode.trim();
            if (cleanPostcode.length < 3) {
                areaInput.value = '';
                return;
            }

            try {
                const res = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(cleanPostcode)}`);
                const data = await res.json();
                if (data.status === 200 && data.result) {
                    const r = data.result;
                    areaInput.value = r.admin_district || r.region || r.parish || 'United Kingdom';
                } else {
                    areaInput.value = 'Searching area...';
                }
            } catch (err) {
                console.error('Postcode lookup error:', err);
                areaInput.value = 'Unavailable';
            }
        }

        async function lookupDropoffPostcode(postcode) {
            const cleanPostcode = postcode.trim();
            const regionInput = document.getElementById('dropoffRegion');
            if (cleanPostcode.length < 3) {
                regionInput.value = '';
                dropoffCoords = { lat: null, lng: null };
                return;
            }

            try {
                const res = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(cleanPostcode)}`);
                const data = await res.json();
                if (data.status === 200 && data.result) {
                    const r = data.result;
                    regionInput.value = r.admin_district || r.region || r.parish || 'United Kingdom';
                    dropoffCoords.lat = r.latitude;
                    dropoffCoords.lng = r.longitude;
                    calculateOrderDistance();
                } else {
                    regionInput.value = 'Searching...';
                }
            } catch (err) {
                console.error('Dropoff postcode lookup error:', err);
                regionInput.value = 'Unavailable';
            }
        }

        function calculateOrderDistance() {
            const pickupSelectVal = document.getElementById('orderPickup').value;
            if (!pickupSelectVal || !dropoffCoords.lat || !dropoffCoords.lng) return;

            let businesses = JSON.parse(localStorage.getItem('registered_businesses') || '[]');
            const matchedBus = businesses.find(b => {
                const addr2 = b.address2 ? `, ${b.address2}` : '';
                const fullStr = `${b.name} (${b.address1}${addr2}, ${b.area ? b.area + ' - ' : ''}${b.postcode})`;
                return fullStr === pickupSelectVal;
            });

            if (matchedBus && matchedBus.lat && matchedBus.lng) {
                const distanceMiles = getDistanceFromLatLonInMiles(matchedBus.lat, matchedBus.lng, dropoffCoords.lat, dropoffCoords.lng);
                
                // Calculate prices based on your exact rules:
                // Rule 1: Starts from £3.80 for up to 3 miles. Then 15p for every 0.10 miles.
                let singlePrice = 3.80;
                if (distanceMiles > 3.0) {
                    const extraMiles = distanceMiles - 3.0;
                    const blocksOfPointOne = Math.ceil(extraMiles / 0.10);
                    singlePrice += blocksOfPointOne * 0.15;
                }

                // Rule 2: If two deliveries to one person, second delivery charged by 11.5p for every 0.01 miles.
                // Let's compute second delivery rate structure based on 11.5p per 0.01 miles
                const blocksOfPointZeroOne = Math.ceil(distanceMiles / 0.01);
                const doubleDeliverySecondPrice = blocksOfPointZeroOne * 0.115;
                const totalDoublePrice = singlePrice + doubleDeliverySecondPrice;

                document.getElementById('calculatedDistanceText').innerText = `${distanceMiles.toFixed(2)} miles analysed`;
                document.getElementById('distanceBadge').innerHTML = `
                    1st: £${singlePrice.toFixed(2)}<br>
                    <span class="text-xs text-indigo-700 font-semibold">Dual (2nd): £${totalDoublePrice.toFixed(2)}</span>
                `;
            }
        }

        function getDistanceFromLatLonInMiles(lat1, lon1, lat2, lon2) {
            const R = 3958.8; // Radius of the earth in miles
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }

        function deg2rad(deg) {
            return deg * (Math.PI/180);
        }

        function loadRegisteredBusinesses() {
            const pickupSelect = document.getElementById('orderPickup');
            if (!pickupSelect) return;

            let businesses = JSON.parse(localStorage.getItem('registered_businesses') || '[]');

            let optionsHtml = '<option value="">Select Registered Business</option>';
            businesses.forEach(b => {
                const addr2 = b.address2 ? `, ${b.address2}` : '';
                const fullAddress = `${b.address1}${addr2}, ${b.area ? b.area + ' - ' : ''}${b.postcode}`;
                optionsHtml += `<option value="${b.name} (${fullAddress})">${b.name} - ${fullAddress}</option>`;
            });
            pickupSelect.innerHTML = optionsHtml;
        }

        async function handleAddBusiness(e) {
            e.preventDefault();
            const name = document.getElementById('busName').value.trim();
            const phone = document.getElementById('busPhone').value.trim();
            const address1 = document.getElementById('busAddress1').value.trim();
            const address2 = document.getElementById('busAddress2').value.trim();
            const postcode = document.getElementById('busPostcode').value.trim().toUpperCase();
            const area = document.getElementById('busArea').value.trim();

            if (!name || !phone || !address1 || !postcode) return;

            let lat = null;
            let lng = null;
            try {
                const res = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(postcode)}`);
                const data = await res.json();
                if (data.status === 200 && data.result) {
                    lat = data.result.latitude;
                    lng = data.result.longitude;
                }
            } catch (err) {
                console.error('Error fetching business coordinates:', err);
            }

            let businesses = JSON.parse(localStorage.getItem('registered_businesses') || '[]');
            businesses.push({ id: Date.now(), name, phone, address1, address2, postcode, area, lat, lng });
            localStorage.setItem('registered_businesses', JSON.stringify(businesses));

            document.getElementById('addBusinessForm').reset();
            document.getElementById('busArea').value = '';
            loadBusinessesManagement();
            loadRegisteredBusinesses();
            refreshMapPins();
            alert('Business saved and pinned on map successfully!');
        }

        function loadBusinessesManagement() {
            let businesses = JSON.parse(localStorage.getItem('registered_businesses') || '[]');
            const container = document.getElementById('businessesListContainer');
            if (!container) return;

            if (businesses.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-6 font-semibold">No businesses registered yet.</p>`;
                return;
            }

            container.innerHTML = '';
            businesses.forEach((b, index) => {
                const addr2Str = b.address2 ? `, ${b.address2}` : '';
                const areaStr = b.area ? `(${b.area})` : '';
                container.innerHTML += `
                    <div class="bg-gray-50 p-3.5 rounded-xl border flex justify-between items-center">
                        <div>
                            <p class="font-bold text-gray-900 text-base">${b.name} <span class="text-gray-500 font-normal text-sm">(${b.phone})</span></p>
                            <p class="text-gray-700 text-xs mt-0.5">${b.address1}${addr2Str}, ${b.postcode} <span class="text-blue-700 font-bold">${areaStr}</span></p>
                        </div>
                        <button onclick="deleteBusiness(${index})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">Delete</button>
                    </div>
                `;
            });
        }

        function deleteBusiness(index) {
            let businesses = JSON.parse(localStorage.getItem('registered_businesses') || '[]');
            businesses.splice(index, 1);
            localStorage.setItem('registered_businesses', JSON.stringify(businesses));
            loadBusinessesManagement();
            loadRegisteredBusinesses();
            refreshMapPins();
        }

        async function handleCreateOrder(e) {
            e.preventDefault();
            const addr1 = document.getElementById('dropoffAddress1').value.trim();
            const addr2 = document.getElementById('dropoffAddress2').value.trim();
            const region = document.getElementById('dropoffRegion').value.trim();
            const postcode = document.getElementById('dropoffPostcode').value.trim().toUpperCase();
            
            const formattedDropoff = `${addr1}${addr2 ? ', ' + addr2 : ''}, ${region} - ${postcode}`;

            const orderData = {
                customerName: document.getElementById('orderCustName').value.trim(),
                customerPhone: document.getElementById('orderCustPhone').value.trim(),
                pickupAddress: document.getElementById('orderPickup').value.trim(),
                dropoffAddress: formattedDropoff,
                specialNotes: document.getElementById('orderNotes').value.trim()
            };

            if (!orderData.pickupAddress) {
                alert('Please select a registered business for pickup.');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                if (res.ok) {
                    alert('Order created successfully!');
                    document.getElementById('createOrderForm').reset();
                    document.getElementById('dropoffRegion').value = '';
                    document.getElementById('calculatedDistanceText').innerText = 'Select pickup & enter drop-off postcode';
                    document.getElementById('distanceBadge').innerText = '0.0 miles';
                    dropoffCoords = { lat: null, lng: null };
                    loadRegisteredBusinesses();
                    fetchOrders();
                }
            } catch (err) {
                console.error('Error creating order:', err);
            }
        }

        async function fetchOrders() {
            try {
                const res = await fetch(`${API_URL}/orders`);
                const orders = await res.json();
                allOrdersCache = orders;

                const activeTable = document.getElementById('activeOrdersTableBody');
                const completedTable = document.getElementById('completedOrdersTableBody');
                
                const activeOrders = orders.filter(o => o.status !== 'Delivered');
                const completedOrders = orders.filter(o => o.status === 'Delivered');

                let registeredDrivers = JSON.parse(localStorage.getItem('registered_drivers') || '[]');
                
                let onlineDrivers = registeredDrivers.filter(d => {
                    const isApproved = d.status === 'Approved';
                    const hasLiveLocation = onlineDriversCache[d.id] && onlineDriversCache[d.id].lat && onlineDriversCache[d.id].lng;
                    return isApproved && hasLiveLocation;
                });

                if (activeOrders.length === 0) {
                    activeTable.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-400 font-semibold">No active orders found.</td></tr>`;
                } else {
                    activeTable.innerHTML = '';
                    activeOrders.forEach(order => {
                        let optionsHtml = `<option value="">Select Online Driver</option>`;
                        onlineDrivers.forEach(d => {
                            optionsHtml += `<option value="${d.id}" ${String(order.assignedDriverId) === String(d.id) ? 'selected' : ''}>${d.firstName} ${d.surname}</option>`;
                        });

                        activeTable.innerHTML += `
                            <tr class="border-b hover:bg-gray-50">
                                <td class="p-3 font-bold text-gray-900">#${order.id} - ${order.customerName}<br><span class="text-xs text-gray-600 font-normal">${order.customerPhone}</span></td>
                                <td class="p-3 text-gray-800">From: ${order.pickupAddress}<br>To: ${order.dropoffAddress}</td>
                                <td class="p-3">
                                    <select onchange="assignDriver('${order.id}', this.value)" class="border p-2 rounded-lg text-sm font-semibold w-full bg-white">${optionsHtml}</select>
                                </td>
                                <td class="p-3"><span class="bg-amber-100 text-amber-900 px-2.5 py-1 rounded-lg font-bold text-xs">${order.status || 'Pending'}</span></td>
                            </tr>
                        `;
                    });
                }

                document.getElementById('completedCountBadge').innerText = `${completedOrders.length} Orders`;
                if (completedOrders.length === 0) {
                    completedTable.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-400 font-semibold">No completed orders found.</td></tr>`;
                } else {
                    completedTable.innerHTML = '';
                    completedOrders.forEach(order => {
                        let registeredDriversAll = JSON.parse(localStorage.getItem('registered_drivers') || '[]');
                        const assignedDriver = registeredDriversAll.find(d => String(d.id) === String(order.assignedDriverId));
                        const driverNameDisplay = assignedDriver ? `${assignedDriver.firstName} ${assignedDriver.surname}` : `Driver #${order.assignedDriverId || 'N/A'}`;

                        completedTable.innerHTML += `
                            <tr class="border-b hover:bg-gray-50">
                                <td class="p-3 font-bold text-gray-900">#${order.id} - ${order.customerName}</td>
                                <td class="p-3 text-gray-800">From: ${order.pickupAddress}<br>To: ${order.dropoffAddress}</td>
                                <td class="p-3 text-gray-900 font-semibold">${driverNameDisplay}</td>
                                <td class="p-3"><span class="bg-emerald-100 text-emerald-900 px-2.5 py-1 rounded-lg font-bold text-xs">Delivered</span></td>
                            </tr>
                        `;
                    });
                }

                if (!document.getElementById('tabContentDrivers').classList.contains('hidden')) {
                    loadDriversManagement();
                }
            } catch (e) {
                console.error('Error fetching orders:', e);
            }
        }

        async function assignDriver(orderId, driverId) {
            if (!driverId) return;
            try {
                const res = await fetch(`${API_URL}/orders/assign`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId, driverId })
                });
                if (res.ok) fetchOrders();
            } catch (e) {
                console.error('Error assigning driver:', e);
            }
        }

        async function fetchLiveDrivers() {
            try {
                const res = await fetch(`${API_URL}/drivers/locations`);
                const drivers = await res.json();
                
                let registeredDriversAll = JSON.parse(localStorage.getItem('registered_drivers') || '[]');
                let updated = false;
                const currentTimeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                registeredDriversAll.forEach(drv => {
                    const hasLoc = drivers[drv.id] && drivers[drv.id].lat && drivers[drv.id].lng;
                    const wasOnline = onlineDriversCache[drv.id] && onlineDriversCache[drv.id].lat && onlineDriversCache[drv.id].lng;

                    if (hasLoc && !wasOnline) {
                        drv.lastShiftStart = currentTimeStr;
                        drv.lastShiftEnd = 'Ongoing...';
                        updated = true;
                    } else if (!hasLoc && wasOnline) {
                        drv.lastShiftEnd = currentTimeStr;
                        updated = true;
                    }
                });

                if (updated) {
                    localStorage.setItem('registered_drivers', JSON.stringify(registeredDriversAll));
                }

                onlineDriversCache = drivers; 
                refreshMapPins();

                const driversWidget = document.getElementById('liveDriversListWidget');
                let activeDriversCount = 0;
                let driverHtml = '';

                for (const [driverId, data] of Object.entries(drivers)) {
                    if (data.lat && data.lng) {
                        activeDriversCount++;
                        const drvObj = registeredDriversAll.find(d => String(d.id) === String(driverId));
                        const drvName = drvObj ? `${drvObj.firstName} ${drvObj.surname}` : `Driver #${driverId}`;
                        
                        driverHtml += `<div class="text-emerald-800 font-bold text-sm">• 🚗 ${drvName} (Online)</div>`;
                    }
                }

                if (activeDriversCount === 0) {
                    driversWidget.innerHTML = `<span class="text-gray-400">No active drivers online.</span>`;
                } else {
                    driversWidget.innerHTML = driverHtml;
                }

                fetchOrders();

                if (!document.getElementById('tabContentDrivers').classList.contains('hidden')) {
                    loadDriversManagement();
                }
            } catch (e) {
                console.error('Error fetching driver locations:', e);
            }
        }

        function refreshMapPins() {
            if (markersLayer) {
                markersLayer.clearLayers();
                addPinsToLayer(markersLayer);
            }
            if (dedicatedMarkersLayer) {
                dedicatedMarkersLayer.clearLayers();
                addPinsToLayer(dedicatedMarkersLayer);
            }
        }

        function addPinsToLayer(layerGroup) {
            let businesses = JSON.parse(localStorage.getItem('registered_businesses') || '[]');
            businesses.forEach(b => {
                if (b.lat && b.lng) {
                    const marker = L.marker([b.lat, b.lng], { icon: businessIcon })
                        .bindPopup(`<b>🏢 ${b.name} (Business)</b><br>${b.address1}, ${b.postcode}`);
                    layerGroup.addLayer(marker);
                }
            });

            let registeredDriversAll = JSON.parse(localStorage.getItem('registered_drivers') || '[]');
            for (const [driverId, data] of Object.entries(onlineDriversCache)) {
                if (data.lat && data.lng) {
                    const drvObj = registeredDriversAll.find(d => String(d.id) === String(driverId));
                    const drvName = drvObj ? `${drvObj.firstName} ${drvObj.surname}` : `Driver #${driverId}`;
                    
                    const marker = L.marker([data.lat, data.lng], { icon: carIcon })
                        .bindPopup(`<b>🚗 ${drvName}</b><br>Status: Online (Active Car)`);
                    layerGroup.addLayer(marker);
                }
            }
        }

        function loadDriversManagement() {
            let registered = JSON.parse(localStorage.getItem('registered_drivers') || '[]');
            const dirContainer = document.getElementById('driversDirectoryContainer');
            const earnContainer = document.getElementById('driversEarningsContainer');
            
            if (!dirContainer || !earnContainer) return;

            if (registered.length === 0) {
                dirContainer.innerHTML = `<p class="text-gray-400 text-center py-6 font-semibold">No driver applications pending or registered.</p>`;
                earnContainer.innerHTML = `<p class="text-gray-400 text-center py-6 font-semibold">No shift history available.</p>`;
                return;
            }

            dirContainer.innerHTML = '';
            earnContainer.innerHTML = '';

            registered.forEach((drv, index) => {
                const isOnline = onlineDriversCache[drv.id] && onlineDriversCache[drv.id].lat && onlineDriversCache[drv.id].lng;
                const driverCompletedOrders = allOrdersCache.filter(o => String(o.assignedDriverId) === String(drv.id) && o.status === 'Delivered');
                
                const RATE_PER_ORDER = 5.00;
                const totalEarnings = driverCompletedOrders.length * RATE_PER_ORDER;

                const shiftStart = drv.lastShiftStart || (isOnline ? 'Active Session' : 'Not Started');
                const shiftEnd = isOnline ? 'Ongoing...' : (drv.lastShiftEnd || 'Offline');

                dirContainer.innerHTML += `
                    <div class="bg-gray-50 p-4 rounded-xl border flex flex-wrap justify-between items-center gap-3">
                        <div>
                            <div class="flex items-center gap-3">
                                <h3 class="font-bold text-gray-900 text-base">${drv.firstName} ${drv.surname}</h3>
                                ${isOnline 
                                    ? `<span class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full text-xs font-extrabold inline-flex items-center gap-1.5"><span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Online</span>`
                                    : `<span class="bg-gray-200 text-gray-600 px-2.5 py-0.5 rounded-full text-xs font-bold">Offline</span>`
                                }
                            </div>
                            <p class="text-gray-600 text-xs mt-1">📞 Phone: <a href="tel:${drv.mobile}" class="text-blue-600 font-bold hover:underline">${drv.mobile}</a></p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold px-3 py-1 rounded-lg text-xs ${drv.status === 'Approved' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">Approval: ${drv.status}</span>
                            ${drv.status !== 'Approved' ? `<button onclick="approveDriver(${index})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-lg font-bold text-xs transition">Approve</button>` : ''}
                        </div>
                    </div>
                `;

                earnContainer.innerHTML += `
                    <div class="bg-gray-50 p-4 rounded-xl border space-y-3">
                        <div class="flex justify-between items-center border-b pb-2">
                            <h3 class="font-bold text-gray-900 text-sm">${drv.firstName} ${drv.surname}</h3>
                            ${isOnline 
                                ? `<span class="text-emerald-700 font-bold text-xs">● Active Shift</span>`
                                : `<span class="text-gray-500 font-bold text-xs">● Shift Closed</span>`
                            }
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
                            <div class="bg-white p-3 rounded-lg border">
                                <span class="text-gray-500 block font-semibold">Shift Started</span>
                                <span class="text-gray-900 font-bold text-sm">${shiftStart}</span>
                            </div>
                            <div class="bg-white p-3 rounded-lg border">
                                <span class="text-gray-500 block font-semibold">Shift Ended</span>
                                <span class="text-gray-900 font-bold text-sm">${shiftEnd}</span>
                            </div>
                            <div class="bg-white p-3 rounded-lg border">
                                <span class="text-gray-500 block font-semibold">Total Deliveries</span>
                                <span class="text-blue-700 font-extrabold text-sm">${driverCompletedOrders.length} Orders</span>
                            </div>
                            <div class="bg-white p-3 rounded-lg border">
                                <span class="text-gray-500 block font-semibold">Total Earned (£5/order)</span>
                                <span class="text-emerald-700 font-extrabold text-sm">£${totalEarnings.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function approveDriver(index) {
            let registered = JSON.parse(localStorage.getItem('registered_drivers') || '[]');
            if (registered[index]) {
                registered[index].status = 'Approved';
                localStorage.setItem('registered_drivers', JSON.stringify(registered));
                loadDriversManagement();
                alert('Driver approved successfully!');
            }
        }

        window.onload = () => {
            initAdminMap();
            loadRegisteredBusinesses();
            loadBusinessesManagement();
            fetchOrders();
            fetchLiveDrivers();
            setInterval(fetchOrders, 5000);
            setInterval(fetchLiveDrivers, 4000);
        };
    </script>
